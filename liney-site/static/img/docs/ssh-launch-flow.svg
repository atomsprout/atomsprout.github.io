<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SSH launch flow in Liney</title>
  <desc id="desc">A diagram showing SSH presets and saved targets feeding into a reusable remote session.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1120" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101722"/>
      <stop offset="1" stop-color="#0B1018"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4A8BFF"/>
      <stop offset="1" stop-color="#77C5FF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16A678"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E68A2E"/>
      <stop offset="1" stop-color="#FFC37A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#02050A" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <text x="86" y="102" fill="#EEF4FC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Reusable remote launch flow</text>
  <text x="86" y="144" fill="#9CAAC2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Presets describe how to connect. Targets describe where that connection belongs.</text>

  <rect x="88" y="204" width="284" height="314" rx="28" fill="#121A28" stroke="#2B3E5E" filter="url(#shadow)"/>
  <text x="122" y="256" fill="#F6FAFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">SSH preset</text>
  <rect x="122" y="288" width="214" height="50" rx="14" fill="url(#blue)"/>
  <text x="152" y="320" fill="#F7FBFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">host + user</text>
  <rect x="122" y="352" width="214" height="50" rx="14" fill="url(#blue)"/>
  <text x="152" y="384" fill="#F7FBFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">port + key</text>
  <rect x="122" y="416" width="214" height="50" rx="14" fill="url(#blue)"/>
  <text x="152" y="448" fill="#F7FBFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">working dir</text>
  <rect x="122" y="480" width="214" height="50" rx="14" fill="url(#blue)"/>
  <text x="152" y="512" fill="#F7FBFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">reopen fast</text>

  <rect x="458" y="204" width="284" height="314" rx="28" fill="#121A28" stroke="#2B3E5E" filter="url(#shadow)"/>
  <text x="492" y="256" fill="#F6FAFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Saved targets</text>
  <rect x="492" y="288" width="214" height="70" rx="16" fill="url(#green)"/>
  <text x="522" y="320" fill="#F7FFFB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Prod box</text>
  <text x="522" y="344" fill="#E6FFF6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">deploy@prod.example.com</text>
  <rect x="492" y="376" width="214" height="70" rx="16" fill="url(#green)"/>
  <text x="522" y="408" fill="#F7FFFB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">GPU box</text>
  <text x="522" y="432" fill="#E6FFF6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">ml@gpu.example.com</text>
  <rect x="492" y="464" width="214" height="70" rx="16" fill="#163044" stroke="#2C4764"/>
  <text x="522" y="506" fill="#B8C7DB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">workspace specific</text>

  <rect x="828" y="162" width="288" height="390" rx="30" fill="#121A28" stroke="#2B3E5E" filter="url(#shadow)"/>
  <text x="862" y="214" fill="#F6FAFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">New SSH Session</text>
  <rect x="862" y="246" width="220" height="42" rx="12" fill="#0E1624" stroke="#304461"/>
  <text x="888" y="272" fill="#A7B4CB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">preset: saved fields</text>
  <rect x="862" y="302" width="220" height="42" rx="12" fill="#0E1624" stroke="#304461"/>
  <text x="888" y="328" fill="#A7B4CB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">target: Prod box</text>
  <rect x="862" y="366" width="220" height="130" rx="18" fill="url(#orange)"/>
  <text x="890" y="408" fill="#FFF9F2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">host, user, port</text>
  <text x="890" y="434" fill="#FFF9F2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">remote dir fallback</text>
  <text x="890" y="460" fill="#FFF9F2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">enter password</text>

  <path d="M372 362H438" stroke="#345A84" stroke-width="4" stroke-linecap="round"/>
  <path d="M742 362H808" stroke="#345A84" stroke-width="4" stroke-linecap="round"/>
  <path d="M428 344L448 362L428 380" stroke="#345A84" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M798 344L818 362L798 380" stroke="#345A84" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="858" y="602" fill="#9DAAC2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Open session now or save the connection so next time you mostly just enter the password.</text>
</svg>
