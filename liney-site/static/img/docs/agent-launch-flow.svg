<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent launch flow in Liney</title>
  <desc id="desc">A diagram showing agent presets reused across local sessions, workflows, HAPI, and remote targets.</desc>
  <defs>
    <linearGradient id="bg" x1="84" y1="72" x2="1124" y2="662" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111924"/>
      <stop offset="1" stop-color="#0B1017"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D9BF0"/>
      <stop offset="1" stop-color="#78D8FF"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F9D79"/>
      <stop offset="1" stop-color="#6EE7C0"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9A63FF"/>
      <stop offset="1" stop-color="#E29BFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#02050A" flood-opacity="0.44"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <text x="88" y="102" fill="#EEF4FC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Agent preset as a reusable default</text>
  <text x="88" y="144" fill="#A0ADC5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">One good launch recipe can drive local sessions, workflows, remote targets, and HAPI entry points.</text>

  <rect x="96" y="214" width="300" height="288" rx="30" fill="#121A28" stroke="#2B3E5E" filter="url(#shadow)"/>
  <text x="132" y="264" fill="#F7FBFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Preferred preset</text>
  <rect x="132" y="298" width="228" height="64" rx="18" fill="url(#cyan)"/>
  <text x="164" y="338" fill="#F8FCFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Codex</text>
  <rect x="132" y="378" width="228" height="92" rx="18" fill="#0E1624" stroke="#304461"/>
  <text x="160" y="414" fill="#A8B6CD" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">launch path</text>
  <text x="160" y="438" fill="#A8B6CD" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">arguments</text>
  <text x="160" y="462" fill="#A8B6CD" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">environment</text>

  <rect x="492" y="162" width="252" height="118" rx="24" fill="url(#mint)" filter="url(#shadow)"/>
  <text x="526" y="210" fill="#F7FFFB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">New agent session</text>
  <text x="526" y="244" fill="#E8FFF7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">open in active worktree</text>

  <rect x="492" y="300" width="252" height="118" rx="24" fill="url(#mint)" filter="url(#shadow)"/>
  <text x="526" y="348" fill="#F7FFFB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Workspace workflow</text>
  <text x="526" y="382" fill="#E8FFF7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">launch agent beside shell</text>

  <rect x="492" y="438" width="252" height="118" rx="24" fill="url(#mint)" filter="url(#shadow)"/>
  <text x="526" y="486" fill="#F7FFFB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Remote target</text>
  <text x="526" y="520" fill="#E8FFF7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">run the same tool remotely</text>

  <rect x="840" y="230" width="264" height="256" rx="28" fill="#121A28" stroke="#2B3E5E" filter="url(#shadow)"/>
  <text x="874" y="280" fill="#F8FBFF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">HAPI in context</text>
  <rect x="874" y="314" width="196" height="56" rx="16" fill="url(#pink)"/>
  <text x="908" y="348" fill="#FFF8FF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Launch in worktree</text>
  <text x="874" y="406" fill="#AEBAD0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">The important part is not just</text>
  <text x="874" y="432" fill="#AEBAD0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">which tool starts, but where</text>
  <text x="874" y="458" fill="#AEBAD0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">that tool starts.</text>

  <path d="M396 356H468" stroke="#35547D" stroke-width="4" stroke-linecap="round"/>
  <path d="M744 220H816" stroke="#35547D" stroke-width="4" stroke-linecap="round"/>
  <path d="M744 358H816" stroke="#35547D" stroke-width="4" stroke-linecap="round"/>
  <path d="M744 496H816" stroke="#35547D" stroke-width="4" stroke-linecap="round"/>
  <path d="M456 338L476 356L456 374" stroke="#35547D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M806 202L826 220L806 238" stroke="#35547D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M806 340L826 358L806 376" stroke="#35547D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M806 478L826 496L806 514" stroke="#35547D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="96" y="628" fill="#97A4BC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Built-in examples include Claude Code, Codex, OpenCode, Cursor Agent, and Gemini CLI.</text>
</svg>
