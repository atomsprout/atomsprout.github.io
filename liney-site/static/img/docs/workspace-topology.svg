<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Liney workspace topology</title>
  <desc id="desc">A diagram showing a workspace branching into worktrees and terminal sessions.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1080" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121722"/>
      <stop offset="1" stop-color="#0C1018"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#182033"/>
      <stop offset="1" stop-color="#101726"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#69E5B1"/>
      <stop offset="1" stop-color="#48B4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#02050A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1020" cy="132" r="128" fill="#163047" fill-opacity="0.36"/>
  <circle cx="188" cy="590" r="156" fill="#13392E" fill-opacity="0.34"/>

  <rect x="72" y="98" width="246" height="520" rx="28" fill="url(#panel)" stroke="#243149" filter="url(#shadow)"/>
  <text x="108" y="150" fill="#E9EEF8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Workspace</text>
  <text x="108" y="184" fill="#92A0B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">One repository. Visible state.</text>

  <rect x="108" y="224" width="174" height="56" rx="16" fill="#101827" stroke="#2B3A53"/>
  <circle cx="136" cy="252" r="8" fill="#69E5B1"/>
  <text x="156" y="258" fill="#DCE6F9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">liney</text>

  <rect x="108" y="304" width="174" height="94" rx="18" fill="#132235" stroke="#314868"/>
  <text x="132" y="338" fill="#E7EEF8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Signals</text>
  <text x="132" y="366" fill="#9CAAC1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">current worktree</text>
  <text x="132" y="388" fill="#9CAAC1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">activity dot</text>

  <rect x="108" y="424" width="174" height="146" rx="18" fill="#0F1725" stroke="#2A3C57"/>
  <text x="132" y="458" fill="#E7EEF8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Stored with repo</text>
  <text x="132" y="486" fill="#9CAAC1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">remote targets</text>
  <text x="132" y="508" fill="#9CAAC1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">agent presets</text>
  <text x="132" y="530" fill="#9CAAC1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">workflows</text>

  <path d="M318 272C390 272 390 204 462 204" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M318 348C390 348 390 348 462 348" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M318 502C390 502 390 492 462 492" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <rect x="462" y="136" width="292" height="140" rx="26" fill="url(#panel)" stroke="#26364F" filter="url(#shadow)"/>
  <text x="494" y="180" fill="#EAF1FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Main worktree</text>
  <text x="494" y="216" fill="#99A7BF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">stable commands, release checks</text>
  <rect x="494" y="234" width="112" height="18" rx="9" fill="#1B3140"/>
  <text x="620" y="249" fill="#69E5B1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">CURRENT</text>

  <rect x="462" y="280" width="292" height="140" rx="26" fill="url(#panel)" stroke="#26364F" filter="url(#shadow)"/>
  <text x="494" y="324" fill="#EAF1FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Feature worktree</text>
  <text x="494" y="360" fill="#99A7BF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">implementation, tests, review</text>
  <circle cx="700" cy="334" r="9" fill="#69E5B1"/>
  <text x="494" y="390" fill="#AAB6CB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">active panes stay attached here</text>

  <rect x="462" y="424" width="292" height="140" rx="26" fill="url(#panel)" stroke="#26364F" filter="url(#shadow)"/>
  <text x="494" y="468" fill="#EAF1FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Review worktree</text>
  <text x="494" y="504" fill="#99A7BF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">check another branch without drift</text>

  <path d="M754 206C814 206 814 178 878 178" stroke="#3A516F" stroke-width="4" stroke-linecap="round"/>
  <path d="M754 350C814 350 814 318 878 318" stroke="#3A516F" stroke-width="4" stroke-linecap="round"/>
  <path d="M754 494C814 494 814 458 878 458" stroke="#3A516F" stroke-width="4" stroke-linecap="round"/>

  <rect x="878" y="120" width="250" height="116" rx="24" fill="#121C2B" stroke="#2B3E5D" filter="url(#shadow)"/>
  <text x="910" y="164" fill="#EAF1FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Terminal session</text>
  <text x="910" y="198" fill="#A4B0C6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">release commands</text>

  <rect x="878" y="260" width="250" height="116" rx="24" fill="#121C2B" stroke="#2B3E5D" filter="url(#shadow)"/>
  <text x="910" y="304" fill="#EAF1FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Agent session</text>
  <text x="910" y="338" fill="#A4B0C6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Codex or Claude Code</text>

  <rect x="878" y="400" width="250" height="116" rx="24" fill="#121C2B" stroke="#2B3E5D" filter="url(#shadow)"/>
  <text x="910" y="444" fill="#EAF1FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Remote session</text>
  <text x="910" y="478" fill="#A4B0C6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">saved SSH target</text>

  <text x="72" y="668" fill="#93A0B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Liney keeps the repository, worktree, and session model visible instead of leaving it implicit.</text>
</svg>
